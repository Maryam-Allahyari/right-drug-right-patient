# Runs the tests in tests/testthat on every push and pull request:
# the simulator, the SDTM -> ADaM pipeline against the simulated truth,
# and the analysis methods. Only the packages the tests need are installed,
# with admiral and admiralonco at the versions the project uses.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::dplyr
            any::tidyr
            any::survival
            admiral@1.3.1
            admiralonco@1.4.0

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'
