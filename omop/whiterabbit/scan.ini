# WhiteRabbit scan of the full lung cancer Synthea CSVs.
# Gives a ScanReport.xlsx with every table, column, data type, empty values and
# the most common values, which is what the OMOP mapping is designed from.
#
# Run from the WhiteRabbit folder (Windows):
#   bin\whiteRabbit.bat -ini <path to this file>
# For CSV files the report is written into the same folder as the CSVs.

WORKING_FOLDER = M:/Data/synthea/full_lung/csv
DATA_TYPE = Delimited text files
DELIMITER = ,
TABLES_TO_SCAN = allergies.csv,careplans.csv,claims.csv,claims_transactions.csv,conditions.csv,devices.csv,encounters.csv,imaging_studies.csv,immunizations.csv,medications.csv,observations.csv,organizations.csv,patients.csv,payer_transitions.csv,payers.csv,procedures.csv,providers.csv,supplies.csv
SCAN_FIELD_VALUES = yes
MIN_CELL_COUNT = 5
MAX_DISTINCT_VALUES = 1000
ROWS_PER_TABLE = 100000
CALCULATE_NUMERIC_STATS = no
NUMERIC_STATS_SAMPLER_SIZE = 500
